<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route zur Lieferadresse – Edeler Döner</title>
<meta name="description" content="Navigation zur Lieferadresse für die Fahrer von Edeler Döner.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0b0d">
<link rel="icon" type="image/png" sizes="48x48" href="/img/favicon-48.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/legal.css">
<style>
  .rt{min-height:calc(100vh - 160px);display:grid;place-items:center;padding:40px 0}
  .rt .card{text-align:center;max-width:520px;margin:0 auto}
  .rt .addr{font-family:'Playfair Display',Georgia,serif;font-size:clamp(1.4rem,6vw,1.9rem);font-weight:800;color:var(--ink);line-height:1.2;margin:6px 0 22px;overflow-wrap:anywhere}
  .rt .actions{display:grid;gap:10px}
  .rt .btn{justify-content:center;padding:15px 18px;font-size:1rem}
  .rt .gold{background:var(--gold-grad);color:#191308;border:none;font-weight:700}
  .rt .small{margin-top:16px}
</style>
</head>
<body>
<main class="rt">
  <div class="wrap">
    <div class="card">
      <span class="eyebrow">🛵 Lieferung · Edeler Döner</span>
      <h1 class="addr" id="addr">Keine Adresse angegeben</h1>
      <div class="actions" id="actions" hidden>
        <a class="btn gold" id="gmaps" href="#" rel="noopener">Navigation starten (Google Maps)</a>
        <a class="btn" id="amaps" href="#" rel="noopener">Mit Apple Karten öffnen</a>
        <button class="btn" id="copy" type="button">Adresse kopieren</button>
      </div>
      <p class="small" id="hint">Diese Seite öffnet sich über den Routen-Link in einer Lieferbestellung.</p>
    </div>
  </div>
</main>
<footer class="l-foot">
  <div class="wrap">
    <span>© 2026 Edeler Döner Schwetzingen</span>
    <span><a href="/">Startseite</a> · <a href="/impressum">Impressum</a> · <a href="/datenschutz">Datenschutz</a></span>
  </div>
</footer>
<script>
  // Die Adresse steht nur im #-Teil des Links: Er wird nie an einen Server gesendet.
  // Erst der Tipp auf einen Button übergibt sie an die gewählte Navi-App.
  (function(){
    var raw = "";
    try{ raw = decodeURIComponent(location.hash.slice(1)).trim().slice(0, 200); }catch(e){}
    if(!raw) return;
    var q = encodeURIComponent(raw);
    document.getElementById("addr").textContent = raw;
    document.getElementById("gmaps").href = "https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=" + q;
    document.getElementById("amaps").href = "https://maps.apple.com/?dirflg=d&daddr=" + q;
    document.getElementById("actions").hidden = false;
    document.getElementById("hint").textContent = "Tippe auf „Navigation starten“ – die Route öffnet sich in deiner Karten-App.";
    document.getElementById("copy").addEventListener("click", function(){
      var b = this;
      (navigator.clipboard ? navigator.clipboard.writeText(raw) : Promise.reject()).then(function(){ b.textContent = "Kopiert ✓"; }, function(){ b.textContent = raw; });
    });
  })();
</script>
</body>
</html>
